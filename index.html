<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e3a5f">
    <meta name="description" content="SARGest - Registrazione Risorse per Search and Rescue">
    <title>SARGest - Registra Risorsa</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 1rem;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 1rem 0 2rem;
        }

        header h1 {
            color: #4fc3f7;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #90a4ae;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #90a4ae;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: #4fc3f7;
            color: #0d1b2a;
            font-weight: 600;
        }

        .tab:hover:not(.active) {
            background: rgba(255,255,255,0.2);
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card h2 {
            color: #4fc3f7;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #b0bec5;
            font-size: 0.85rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #e0e0e0;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4fc3f7;
        }

        .form-group select {
            cursor: pointer;
        }

        .form-group select option {
            background: #1e3a5f;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4fc3f7;
            color: #0d1b2a;
        }

        .btn-primary:hover {
            background: #81d4fa;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .btn-danger {
            background: #ef5350;
            color: white;
        }

        .btn-danger:hover {
            background: #f44336;
        }

        .btn-small {
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            width: auto;
        }

        .qr-container {
            text-align: center;
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            margin: 1rem 0;
        }

        .qr-container canvas {
            max-width: 100%;
        }

        .qr-placeholder {
            padding: 3rem;
            color: #90a4ae;
            font-size: 0.9rem;
        }

        .profiles-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .profile-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .profile-item:last-child {
            margin-bottom: 0;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-weight: 600;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-type {
            font-size: 0.8rem;
            color: #90a4ae;
        }

        .profile-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .icon-btn.qr {
            background: rgba(79, 195, 247, 0.3);
            color: #4fc3f7;
        }

        .icon-btn.qr:hover {
            background: rgba(79, 195, 247, 0.5);
        }

        .icon-btn.delete {
            background: rgba(239, 83, 80, 0.2);
            color: #ef5350;
        }

        .btn-qr {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: #4fc3f7;
            color: #0d1b2a;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-qr:hover {
            background: #81d4fa;
        }

        .btn-qr:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #90a4ae;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1e3a5f;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header h3 {
            color: #4fc3f7;
        }

        .modal-close {
            background: none;
            border: none;
            color: #90a4ae;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .support-types {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .support-type-btn {
            padding: 0.5rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: transparent;
            color: #90a4ae;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .support-type-btn.active {
            border-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.2);
            color: #4fc3f7;
        }

        .hidden {
            display: none !important;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #4caf50;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            z-index: 2000;
            animation: fadeInOut 3s ease-in-out;
        }

        .toast.error {
            background: #ef5350;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            10%, 90% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SARGest</h1>
            <p>Registrazione Risorse SAR</p>
        </header>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab active" data-tab="profiles">I Miei Profili</button>
            <button class="tab" data-tab="new">Nuovo Profilo</button>
        </div>

        <!-- Profiles Tab -->
        <div id="profiles-tab" class="tab-content">
            <div class="card">
                <h2>Profili Salvati</h2>
                <div id="profiles-list" class="profiles-list">
                    <div class="empty-state">
                        Nessun profilo salvato.<br>
                        Crea il tuo primo profilo!
                    </div>
                </div>
            </div>
        </div>

        <!-- New Profile Tab -->
        <div id="new-tab" class="tab-content hidden">
            <div class="card">
                <h2>Tipo Risorsa</h2>
                <div class="tabs" style="margin-bottom: 0;">
                    <button class="tab active" data-type="person">Persona</button>
                    <button class="tab" data-type="support">Mezzo/Apparato</button>
                </div>
            </div>

            <!-- Person Form -->
            <div id="person-form" class="card">
                <h2>Dati Persona</h2>
                <div class="form-group">
                    <label>Nome e Cognome *</label>
                    <input type="text" id="person-name" placeholder="Mario Rossi" required>
                </div>
                <div class="form-group">
                    <label>Telefono</label>
                    <input type="tel" id="person-phone" placeholder="+39 333 1234567">
                </div>
                <div class="form-group">
                    <label>Organizzazione</label>
                    <input type="text" id="person-org" placeholder="Es. Soccorso Alpino, Protezione Civile">
                </div>
                <div class="form-group">
                    <label>Ruolo/Qualifica</label>
                    <input type="text" id="person-role" placeholder="Es. Tecnico, Medico, Cinofilo">
                </div>
                <div class="form-group">
                    <label>Note</label>
                    <textarea id="person-notes" rows="2" placeholder="Altre informazioni utili..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="saveProfile('person')">Salva Profilo</button>
            </div>

            <!-- Support Form -->
            <div id="support-form" class="card hidden">
                <h2>Dati Mezzo/Apparato</h2>
                <div class="form-group">
                    <label>Tipo</label>
                    <div class="support-types">
                        <button class="support-type-btn active" data-stype="vehicle">Veicolo</button>
                        <button class="support-type-btn" data-stype="aircraft">Aeromobile</button>
                        <button class="support-type-btn" data-stype="drone">Drone</button>
                        <button class="support-type-btn" data-stype="dog_unit">U. Cinofila</button>
                        <button class="support-type-btn" data-stype="boat">Imbarcazione</button>
                        <button class="support-type-btn" data-stype="equipment">Attrezzatura</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nome/Identificativo *</label>
                    <input type="text" id="support-name" placeholder="Es. Jeep Renegade, Drone DJI">
                </div>
                <div class="form-group">
                    <label>Targa/Matricola</label>
                    <input type="text" id="support-plate" placeholder="AA123BB">
                </div>
                <div class="form-group">
                    <label>Note</label>
                    <textarea id="support-notes" rows="2" placeholder="Altre informazioni utili..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="saveProfile('support')">Salva Profilo</button>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>QR Code</h3>
                <button class="modal-close" onclick="closeQrModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="qr-profile-name" style="text-align: center; margin-bottom: 1rem; color: #90a4ae;"></p>
                <div class="qr-container">
                    <canvas id="qr-canvas" style="display:none;"></canvas>
                    <img id="qr-image" alt="QR Code" style="max-width:280px;">
                    <div id="qr-loading" style="padding:2rem;color:#666;">Generazione QR...</div>
                    <div id="qr-error" style="display:none;padding:2rem;color:#ef5350;"></div>
                </div>
                <p style="text-align: center; font-size: 0.85rem; color: #90a4ae; margin-top: 1rem;">
                    Mostra questo QR code all'operatore SARGest per una registrazione rapida
                </p>
            </div>
        </div>
    </div>

    <!-- QR Code Generator - Fully inline, no external dependencies -->
    <script>
    // QRCode generator - simplified inline implementation
    // Based on qrcode-generator by Kazuhiko Arase (MIT License)
    var QRCodeGen = (function() {
        var PAD0 = 0xEC, PAD1 = 0x11;

        // Galois field tables
        var EXP_TABLE = new Array(256);
        var LOG_TABLE = new Array(256);
        (function() {
            for (var i = 0, x = 1; i < 256; i++) {
                EXP_TABLE[i] = x;
                LOG_TABLE[x] = i;
                x <<= 1;
                if (x >= 256) x ^= 0x11d;
            }
        })();

        function gexp(n) { return EXP_TABLE[n % 255]; }
        function glog(n) { return LOG_TABLE[n]; }

        // Error correction polynomials
        function getErrorCorrectPolynomial(ecLength) {
            var a = [1];
            for (var i = 0; i < ecLength; i++) {
                var b = [1, gexp(i)];
                var c = new Array(a.length + 1);
                for (var j = 0; j < c.length; j++) c[j] = 0;
                for (var j = 0; j < a.length; j++) {
                    for (var k = 0; k < b.length; k++) {
                        c[j + k] ^= (a[j] && b[k]) ? gexp((glog(a[j]) + glog(b[k])) % 255) : 0;
                    }
                }
                a = c;
            }
            return a;
        }

        // RS blocks for version 1-10
        var RS_BLOCKS = [
            [1,26,19], [1,26,16], [1,26,13], [1,26,9],
            [1,44,34], [1,44,28], [1,44,22], [1,44,16],
            [1,70,55], [1,70,44], [2,35,17], [2,35,13],
            [1,100,80], [2,50,32], [2,50,24], [4,25,9],
            [1,134,108], [2,67,43], [2,33,15,2,34,16], [2,33,11,2,34,12],
            [2,86,68], [4,43,27], [4,43,19], [4,43,15],
            [2,98,78], [4,49,31], [2,32,14,4,33,15], [4,39,13,1,40,14],
            [2,121,97], [2,60,38,2,61,39], [4,40,18,2,41,19], [4,40,14,2,41,15],
            [2,146,116], [3,58,36,2,59,37], [4,36,16,4,37,17], [4,36,12,4,37,13],
            [2,86,68,2,87,69], [4,69,43,1,70,44], [6,43,19,2,44,20], [6,43,15,2,44,16]
        ];

        // Get RS blocks for version and EC level
        function getRSBlocks(version, ecLevel) {
            var idx = (version - 1) * 4 + ecLevel;
            var rsBlock = RS_BLOCKS[idx];
            var list = [];
            for (var i = 0; i < rsBlock.length; i += 3) {
                var count = rsBlock[i];
                var total = rsBlock[i + 1];
                var data = rsBlock[i + 2];
                for (var j = 0; j < count; j++) {
                    list.push({ totalCount: total, dataCount: data });
                }
            }
            return list;
        }

        // BCH encoding
        function getBCHTypeInfo(data) {
            var d = data << 10;
            while (getBCHDigit(d) - 10 >= 0) d ^= (0x537 << (getBCHDigit(d) - 10));
            return ((data << 10) | d) ^ 0x5412;
        }

        function getBCHTypeNumber(data) {
            var d = data << 12;
            while (getBCHDigit(d) - 12 >= 0) d ^= (0x1f25 << (getBCHDigit(d) - 12));
            return (data << 12) | d;
        }

        function getBCHDigit(data) {
            var digit = 0;
            while (data != 0) { digit++; data >>>= 1; }
            return digit;
        }

        // Pattern positions
        var PATTERN_POSITION = [
            [], [6,18], [6,22], [6,26], [6,30], [6,34],
            [6,22,38], [6,24,42], [6,26,46], [6,28,50], [6,30,54]
        ];

        // Mask functions
        var MASK_FUNCS = [
            function(i,j) { return (i+j) % 2 == 0; },
            function(i,j) { return i % 2 == 0; },
            function(i,j) { return j % 3 == 0; },
            function(i,j) { return (i+j) % 3 == 0; },
            function(i,j) { return (Math.floor(i/2) + Math.floor(j/3)) % 2 == 0; },
            function(i,j) { return (i*j) % 2 + (i*j) % 3 == 0; },
            function(i,j) { return ((i*j) % 2 + (i*j) % 3) % 2 == 0; },
            function(i,j) { return ((i*j) % 3 + (i+j) % 2) % 2 == 0; }
        ];

        // Main QR generator
        function createQR(data, ecLevel) {
            ecLevel = ecLevel || 0; // 0=M, 1=L, 2=H, 3=Q

            // Convert string to bytes
            var bytes = [];
            for (var i = 0; i < data.length; i++) {
                var c = data.charCodeAt(i);
                if (c < 128) bytes.push(c);
                else if (c < 2048) { bytes.push(0xC0 | (c >> 6)); bytes.push(0x80 | (c & 0x3F)); }
                else { bytes.push(0xE0 | (c >> 12)); bytes.push(0x80 | ((c >> 6) & 0x3F)); bytes.push(0x80 | (c & 0x3F)); }
            }

            // Find minimum version
            var version = 1;
            for (; version <= 10; version++) {
                var rsBlocks = getRSBlocks(version, ecLevel);
                var totalData = 0;
                for (var i = 0; i < rsBlocks.length; i++) totalData += rsBlocks[i].dataCount;
                if (bytes.length + 3 <= totalData) break;
            }
            if (version > 10) throw new Error('Data too long');

            // Create data buffer
            var rsBlocks = getRSBlocks(version, ecLevel);
            var totalData = 0, totalCount = 0;
            for (var i = 0; i < rsBlocks.length; i++) {
                totalData += rsBlocks[i].dataCount;
                totalCount += rsBlocks[i].totalCount;
            }

            var buffer = [];
            // Mode indicator (byte mode = 4) + char count
            buffer.push(0x40 | (bytes.length >> 4));
            buffer.push(((bytes.length & 0xF) << 4) | (bytes.length > 0 ? bytes[0] >> 4 : 0));
            for (var i = 0; i < bytes.length; i++) {
                buffer.push(((bytes[i] & 0xF) << 4) | (i + 1 < bytes.length ? bytes[i + 1] >> 4 : 0));
            }

            // Pad to data capacity
            while (buffer.length < totalData) {
                buffer.push(buffer.length % 2 == totalData % 2 ? PAD0 : PAD1);
            }

            // Create modules
            var moduleCount = version * 4 + 17;
            var modules = [];
            for (var i = 0; i < moduleCount; i++) {
                modules[i] = new Array(moduleCount);
                for (var j = 0; j < moduleCount; j++) modules[i][j] = null;
            }

            // Setup patterns
            function setupPositionProbe(row, col) {
                for (var r = -1; r <= 7; r++) {
                    for (var c = -1; c <= 7; c++) {
                        if (row + r < 0 || moduleCount <= row + r || col + c < 0 || moduleCount <= col + c) continue;
                        modules[row + r][col + c] =
                            (0 <= r && r <= 6 && (c == 0 || c == 6)) ||
                            (0 <= c && c <= 6 && (r == 0 || r == 6)) ||
                            (2 <= r && r <= 4 && 2 <= c && c <= 4);
                    }
                }
            }

            setupPositionProbe(0, 0);
            setupPositionProbe(moduleCount - 7, 0);
            setupPositionProbe(0, moduleCount - 7);

            // Timing patterns
            for (var i = 8; i < moduleCount - 8; i++) {
                if (modules[i][6] == null) modules[i][6] = i % 2 == 0;
                if (modules[6][i] == null) modules[6][i] = i % 2 == 0;
            }

            // Alignment patterns
            if (version > 1) {
                var pos = PATTERN_POSITION[version];
                for (var i = 0; i < pos.length; i++) {
                    for (var j = 0; j < pos.length; j++) {
                        var row = pos[i], col = pos[j];
                        if (modules[row][col] != null) continue;
                        for (var r = -2; r <= 2; r++) {
                            for (var c = -2; c <= 2; c++) {
                                modules[row + r][col + c] =
                                    r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0);
                            }
                        }
                    }
                }
            }

            // Create error correction codewords
            var dcdata = [], ecdata = [];
            var offset = 0;
            for (var r = 0; r < rsBlocks.length; r++) {
                var dcCount = rsBlocks[r].dataCount;
                var ecCount = rsBlocks[r].totalCount - dcCount;
                dcdata[r] = buffer.slice(offset, offset + dcCount);
                offset += dcCount;

                var rsPoly = getErrorCorrectPolynomial(ecCount);
                var rawPoly = dcdata[r].slice();
                while (rawPoly.length < dcdata[r].length + ecCount) rawPoly.push(0);

                for (var i = 0; i < dcdata[r].length; i++) {
                    if (rawPoly[0] != 0) {
                        var ratio = glog(rawPoly[0]);
                        for (var j = 0; j < rsPoly.length; j++) {
                            rawPoly[j] ^= gexp((glog(rsPoly[j]) + ratio) % 255);
                        }
                    }
                    rawPoly.shift();
                }
                ecdata[r] = rawPoly;
            }

            // Interleave data and EC
            var maxDc = 0, maxEc = 0;
            for (var r = 0; r < rsBlocks.length; r++) {
                maxDc = Math.max(maxDc, dcdata[r].length);
                maxEc = Math.max(maxEc, ecdata[r].length);
            }

            var data = [];
            for (var i = 0; i < maxDc; i++) {
                for (var r = 0; r < rsBlocks.length; r++) {
                    if (i < dcdata[r].length) data.push(dcdata[r][i]);
                }
            }
            for (var i = 0; i < maxEc; i++) {
                for (var r = 0; r < rsBlocks.length; r++) {
                    if (i < ecdata[r].length) data.push(ecdata[r][i]);
                }
            }

            // Map data with best mask
            var bestMask = 0, minPenalty = Infinity;
            for (var mask = 0; mask < 8; mask++) {
                // Reset modules for format info
                var testModules = [];
                for (var i = 0; i < moduleCount; i++) {
                    testModules[i] = modules[i].slice();
                }

                // Setup format info
                var bits = getBCHTypeInfo((ecLevel << 3) | mask);
                for (var i = 0; i < 15; i++) {
                    var mod = ((bits >> i) & 1) == 1;
                    if (i < 6) testModules[i][8] = mod;
                    else if (i < 8) testModules[i + 1][8] = mod;
                    else testModules[moduleCount - 15 + i][8] = mod;
                }
                for (var i = 0; i < 15; i++) {
                    var mod = ((bits >> i) & 1) == 1;
                    if (i < 8) testModules[8][moduleCount - i - 1] = mod;
                    else if (i < 9) testModules[8][15 - i] = mod;
                    else testModules[8][15 - i - 1] = mod;
                }
                testModules[moduleCount - 8][8] = true;

                // Map data
                var bitIdx = 0, byteIdx = 0, bitCount = 7;
                var up = true;
                for (var col = moduleCount - 1; col > 0; col -= 2) {
                    if (col == 6) col--;
                    for (var cnt = 0; cnt < moduleCount; cnt++) {
                        var row = up ? moduleCount - 1 - cnt : cnt;
                        for (var c = 0; c < 2; c++) {
                            if (testModules[row][col - c] == null) {
                                var dark = false;
                                if (byteIdx < data.length) {
                                    dark = ((data[byteIdx] >> bitCount) & 1) == 1;
                                }
                                if (MASK_FUNCS[mask](row, col - c)) dark = !dark;
                                testModules[row][col - c] = dark;
                                bitCount--;
                                if (bitCount < 0) { byteIdx++; bitCount = 7; }
                            }
                        }
                    }
                    up = !up;
                }

                // Simple penalty calculation (just count consecutive same color)
                var penalty = 0;
                for (var i = 0; i < moduleCount; i++) {
                    var rowCount = 1, colCount = 1;
                    for (var j = 1; j < moduleCount; j++) {
                        if (testModules[i][j] == testModules[i][j-1]) rowCount++;
                        else { if (rowCount >= 5) penalty += rowCount - 2; rowCount = 1; }
                        if (testModules[j][i] == testModules[j-1][i]) colCount++;
                        else { if (colCount >= 5) penalty += colCount - 2; colCount = 1; }
                    }
                    if (rowCount >= 5) penalty += rowCount - 2;
                    if (colCount >= 5) penalty += colCount - 2;
                }

                if (penalty < minPenalty) {
                    minPenalty = penalty;
                    bestMask = mask;
                }
            }

            // Apply best mask
            var bits = getBCHTypeInfo((ecLevel << 3) | bestMask);
            for (var i = 0; i < 15; i++) {
                var mod = ((bits >> i) & 1) == 1;
                if (i < 6) modules[i][8] = mod;
                else if (i < 8) modules[i + 1][8] = mod;
                else modules[moduleCount - 15 + i][8] = mod;
            }
            for (var i = 0; i < 15; i++) {
                var mod = ((bits >> i) & 1) == 1;
                if (i < 8) modules[8][moduleCount - i - 1] = mod;
                else if (i < 9) modules[8][15 - i] = mod;
                else modules[8][15 - i - 1] = mod;
            }
            modules[moduleCount - 8][8] = true;

            // Map data with best mask
            var bitIdx = 0, byteIdx = 0, bitCount = 7;
            var up = true;
            for (var col = moduleCount - 1; col > 0; col -= 2) {
                if (col == 6) col--;
                for (var cnt = 0; cnt < moduleCount; cnt++) {
                    var row = up ? moduleCount - 1 - cnt : cnt;
                    for (var c = 0; c < 2; c++) {
                        if (modules[row][col - c] == null) {
                            var dark = false;
                            if (byteIdx < data.length) {
                                dark = ((data[byteIdx] >> bitCount) & 1) == 1;
                            }
                            if (MASK_FUNCS[bestMask](row, col - c)) dark = !dark;
                            modules[row][col - c] = dark;
                            bitCount--;
                            if (bitCount < 0) { byteIdx++; bitCount = 7; }
                        }
                    }
                }
                up = !up;
            }

            return { modules: modules, size: moduleCount };
        }

        // Render to canvas
        function toDataURL(data, size) {
            size = size || 256;
            var qr = createQR(data);
            var cellSize = Math.floor(size / (qr.size + 8));
            var margin = Math.floor((size - cellSize * qr.size) / 2);

            var canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            var ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            ctx.fillStyle = '#000000';
            for (var r = 0; r < qr.size; r++) {
                for (var c = 0; c < qr.size; c++) {
                    if (qr.modules[r][c]) {
                        ctx.fillRect(margin + c * cellSize, margin + r * cellSize, cellSize, cellSize);
                    }
                }
            }

            return canvas.toDataURL('image/png');
        }

        return {
            toDataURL: function(data, opts) {
                opts = opts || {};
                return Promise.resolve(toDataURL(data, opts.width || 256));
            }
        };
    })();

    // Expose as QRCode for compatibility
    var QRCode = QRCodeGen;
    console.log('QR library loaded inline');
    </script>

    <script>
        // Storage key
        const STORAGE_KEY = 'sargest_profiles';

        // Support type labels
        const SUPPORT_TYPE_LABELS = {
            vehicle: 'Veicolo',
            aircraft: 'Aeromobile',
            drone: 'Drone',
            dog_unit: 'Unita Cinofila',
            boat: 'Imbarcazione',
            equipment: 'Attrezzatura'
        };

        // Current state
        let currentSupportType = 'vehicle';
        let editingProfileId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initTabs();
            initTypeTabs();
            initSupportTypes();
            renderProfiles();
        });

        // Tab navigation
        function initTabs() {
            document.querySelectorAll('.tabs > .tab[data-tab]').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.dataset.tab;

                    // Update tab buttons
                    document.querySelectorAll('.tabs > .tab[data-tab]').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    // Update tab content
                    document.querySelectorAll('.tab-content').forEach(content => {
                        content.classList.add('hidden');
                    });
                    document.getElementById(`${tabId}-tab`).classList.remove('hidden');

                    // Reset form when switching to new tab
                    if (tabId === 'new') {
                        resetForm();
                    }
                });
            });
        }

        // Person/Support type tabs
        function initTypeTabs() {
            document.querySelectorAll('.tab[data-type]').forEach(tab => {
                tab.addEventListener('click', () => {
                    const type = tab.dataset.type;

                    // Update tab buttons
                    document.querySelectorAll('.tab[data-type]').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    // Show/hide forms
                    document.getElementById('person-form').classList.toggle('hidden', type !== 'person');
                    document.getElementById('support-form').classList.toggle('hidden', type !== 'support');
                });
            });
        }

        // Support type buttons
        function initSupportTypes() {
            document.querySelectorAll('.support-type-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.support-type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSupportType = btn.dataset.stype;
                });
            });
        }

        // Get profiles from localStorage
        function getProfiles() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch {
                return [];
            }
        }

        // Save profiles to localStorage
        function setProfiles(profiles) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
        }

        // Render profiles list
        function renderProfiles() {
            const profiles = getProfiles();
            const container = document.getElementById('profiles-list');

            if (profiles.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        Nessun profilo salvato.<br>
                        Crea il tuo primo profilo!
                    </div>
                `;
                return;
            }

            container.innerHTML = profiles.map((profile, index) => {
                const typeLabel = profile.type === 'person'
                    ? 'Persona'
                    : SUPPORT_TYPE_LABELS[profile.supportType] || 'Supporto';
                const name = profile.type === 'person' ? profile.name : profile.name;
                const subtitle = profile.type === 'person'
                    ? (profile.organization || profile.role || '')
                    : (profile.plate || '');

                return `
                    <div class="profile-item">
                        <div class="profile-info">
                            <div class="profile-name">${escapeHtml(name)}</div>
                            <div class="profile-type">${typeLabel}${subtitle ? ' - ' + escapeHtml(subtitle) : ''}</div>
                        </div>
                        <div class="profile-actions">
                            <button class="btn-qr" onclick="showQr(${index})">
                                QR
                            </button>
                            <button class="icon-btn" onclick="editProfile(${index})" title="Modifica">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                                </svg>
                            </button>
                            <button class="icon-btn delete" onclick="deleteProfile(${index})" title="Elimina">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Save profile
        function saveProfile(type) {
            let profile;

            if (type === 'person') {
                const name = document.getElementById('person-name').value.trim();
                if (!name) {
                    showToast('Inserisci nome e cognome', true);
                    return;
                }

                profile = {
                    type: 'person',
                    name: name,
                    phone: document.getElementById('person-phone').value.trim(),
                    organization: document.getElementById('person-org').value.trim(),
                    role: document.getElementById('person-role').value.trim(),
                    notes: document.getElementById('person-notes').value.trim()
                };
            } else {
                const name = document.getElementById('support-name').value.trim();
                if (!name) {
                    showToast('Inserisci nome/identificativo', true);
                    return;
                }

                profile = {
                    type: 'support',
                    supportType: currentSupportType,
                    name: name,
                    plate: document.getElementById('support-plate').value.trim(),
                    notes: document.getElementById('support-notes').value.trim()
                };
            }

            const profiles = getProfiles();

            if (editingProfileId !== null) {
                profiles[editingProfileId] = profile;
                editingProfileId = null;
                showToast('Profilo aggiornato');
            } else {
                profiles.push(profile);
                showToast('Profilo salvato');
            }

            setProfiles(profiles);
            renderProfiles();

            // Switch to profiles tab
            document.querySelector('.tab[data-tab="profiles"]').click();
        }

        // Edit profile
        function editProfile(index) {
            const profiles = getProfiles();
            const profile = profiles[index];

            editingProfileId = index;

            // Switch to new tab
            document.querySelector('.tab[data-tab="new"]').click();

            if (profile.type === 'person') {
                document.querySelector('.tab[data-type="person"]').click();
                document.getElementById('person-name').value = profile.name || '';
                document.getElementById('person-phone').value = profile.phone || '';
                document.getElementById('person-org').value = profile.organization || '';
                document.getElementById('person-role').value = profile.role || '';
                document.getElementById('person-notes').value = profile.notes || '';
            } else {
                document.querySelector('.tab[data-type="support"]').click();
                document.getElementById('support-name').value = profile.name || '';
                document.getElementById('support-plate').value = profile.plate || '';
                document.getElementById('support-notes').value = profile.notes || '';

                // Set support type
                document.querySelectorAll('.support-type-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.stype === profile.supportType);
                });
                currentSupportType = profile.supportType || 'vehicle';
            }
        }

        // Delete profile
        function deleteProfile(index) {
            if (!confirm('Eliminare questo profilo?')) return;

            const profiles = getProfiles();
            profiles.splice(index, 1);
            setProfiles(profiles);
            renderProfiles();
            showToast('Profilo eliminato');
        }

        // Show QR code
        function showQr(index) {
            const profiles = getProfiles();
            const profile = profiles[index];

            // Generate compact QR data
            const qrData = generateQrData(profile);
            console.log('QR Data:', qrData);
            console.log('QR Data length:', qrData.length);

            // Update modal
            document.getElementById('qr-profile-name').textContent = profile.name;
            document.getElementById('qr-modal').classList.add('active');

            // Reset display states
            const qrImage = document.getElementById('qr-image');
            const qrLoading = document.getElementById('qr-loading');
            const qrError = document.getElementById('qr-error');

            qrImage.style.display = 'none';
            qrLoading.style.display = 'block';
            qrError.style.display = 'none';

            // Wait for library if still loading
            generateQrWithRetry(qrData, 0);
        }

        function generateQrWithRetry(qrData, attempt) {
            const qrImage = document.getElementById('qr-image');
            const qrLoading = document.getElementById('qr-loading');
            const qrError = document.getElementById('qr-error');

            console.log('Generating QR, attempt:', attempt);
            console.log('qrData:', qrData);
            console.log('QRCode available:', typeof QRCode !== 'undefined');

            // Check if library is loaded
            if (typeof QRCode === 'undefined') {
                if (attempt < 10) {
                    // Wait and retry
                    setTimeout(() => generateQrWithRetry(qrData, attempt + 1), 300);
                    return;
                }
                qrLoading.style.display = 'none';
                qrError.style.display = 'block';
                qrError.textContent = 'Libreria QR non caricata. Ricarica la pagina.';
                return;
            }

            // Use QRCode.toDataURL from qrcode npm package
            QRCode.toDataURL(qrData, {
                width: 280,
                margin: 2,
                color: { dark: '#000000', light: '#ffffff' }
            })
            .then(function(dataUrl) {
                console.log('QR generated successfully');
                qrImage.src = dataUrl;
                qrImage.style.display = 'block';
                qrLoading.style.display = 'none';
            })
            .catch(function(err) {
                console.error('QR generation error:', err);
                qrLoading.style.display = 'none';
                qrError.style.display = 'block';
                qrError.textContent = 'Errore generazione QR: ' + (err.message || err);
            });
        }

        // Generate QR data (compact JSON with SARGEST: prefix)
        function generateQrData(profile) {
            // Compact keys to minimize QR size
            // t = type (p=person, s=support)
            // n = name
            // p = phone (person) / plate (support)
            // o = organization (person) / supportType (support)
            // r = role
            // x = notes

            let compact;

            if (profile.type === 'person') {
                compact = {
                    t: 'p',
                    n: profile.name
                };
                if (profile.phone) compact.p = profile.phone;
                if (profile.organization) compact.o = profile.organization;
                if (profile.role) compact.r = profile.role;
                if (profile.notes) compact.x = profile.notes;
            } else {
                compact = {
                    t: 's',
                    n: profile.name,
                    o: profile.supportType
                };
                if (profile.plate) compact.p = profile.plate;
                if (profile.notes) compact.x = profile.notes;
            }

            // Use URL-safe Base64 encoding to avoid QR library issues
            const json = JSON.stringify(compact);
            // Convert to bytes, then to base64, then make URL-safe
            let base64;
            try {
                // Encode UTF-8 to bytes array
                const utf8Bytes = new TextEncoder().encode(json);
                // Convert bytes to binary string
                let binaryStr = '';
                for (let i = 0; i < utf8Bytes.length; i++) {
                    binaryStr += String.fromCharCode(utf8Bytes[i]);
                }
                // btoa on binary string
                base64 = btoa(binaryStr);
                // Make URL-safe: replace + with -, / with _, remove =
                base64 = base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
            } catch (e) {
                console.error('Base64 encoding error:', e);
                // Fallback: just use the JSON directly (works for ASCII)
                base64 = json;
            }

            return 'SARGEST:' + base64;
        }

        // Close QR modal
        function closeQrModal() {
            document.getElementById('qr-modal').classList.remove('active');
        }

        // Click outside modal to close
        document.getElementById('qr-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeQrModal();
            }
        });

        // Reset form
        function resetForm() {
            editingProfileId = null;
            document.getElementById('person-name').value = '';
            document.getElementById('person-phone').value = '';
            document.getElementById('person-org').value = '';
            document.getElementById('person-role').value = '';
            document.getElementById('person-notes').value = '';
            document.getElementById('support-name').value = '';
            document.getElementById('support-plate').value = '';
            document.getElementById('support-notes').value = '';

            // Reset to person type
            document.querySelector('.tab[data-type="person"]').click();

            // Reset support type to vehicle
            document.querySelectorAll('.support-type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.stype === 'vehicle');
            });
            currentSupportType = 'vehicle';
        }

        // Show toast notification
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeQrModal();
            }
        });
    </script>
